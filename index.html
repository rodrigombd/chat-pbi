<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resa · KPI Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:       #0e0f0d;
  --surface:  #161710;
  --surface2: #1d1e16;
  --border:   rgba(112,213,73,0.08);
  --border2:  rgba(112,213,73,0.18);
  --accent:   #70d549;
  --accent2:  #52a334;
  --accent-glow: rgba(112,213,73,0.12);
  --text:     #eef0e8;
  --text2:    #8d9080;
  --text3:    #4d5044;
  --radius:   10px;
  --radius-sm:6px;
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* HEADER */
header {
  padding: 10px 18px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
  background: var(--surface);
}
header img {
  height: 28px;
  width: auto;
  display: block;
}
.header-divider {
  width: 1px; height: 20px;
  background: var(--border2);
}
.header-title {
  font-family: 'Playfair Display', serif;
  font-size: 13px;
  font-weight: 400;
  color: var(--text2);
  letter-spacing: 0.03em;
}
.header-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
  margin-left: auto;
  box-shadow: 0 0 6px var(--accent);
}

/* LOADING SCREEN */
#loading-screen {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 14px;
}
.loading-bar-wrap {
  width: 240px;
  height: 2px;
  background: var(--surface2);
  border-radius: 2px;
  overflow: hidden;
}
.loading-bar {
  height: 100%;
  width: 0%;
  background: var(--accent);
  border-radius: 2px;
  animation: loadBar 1.2s ease forwards;
}
@keyframes loadBar { to { width: 100%; } }
.loading-label {
  font-size: 11px;
  color: var(--text3);
  letter-spacing: 0.06em;
}

/* ERROR SCREEN */
#error-screen {
  flex: 1;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 32px;
}
.error-card {
  background: var(--surface);
  border: 1px solid rgba(240,100,80,0.25);
  border-radius: var(--radius);
  padding: 28px 32px;
  max-width: 420px;
  text-align: center;
}
.error-card h2 {
  font-family: 'Playfair Display', serif;
  font-size: 18px;
  font-weight: 400;
  color: #f07a6a;
  margin-bottom: 10px;
}
.error-card p {
  font-size: 12px;
  color: var(--text2);
  line-height: 1.7;
}
.error-card code {
  background: var(--surface2);
  border: 1px solid rgba(240,100,80,0.2);
  border-radius: 4px;
  padding: 2px 6px;
  font-size: 11px;
  color: #f07a6a;
  display: inline-block;
  margin-top: 8px;
  word-break: break-all;
}

/* CHAT PANEL */
#chat-panel {
  flex: 1;
  display: none;
  flex-direction: column;
  overflow: hidden;
}
#messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px 20px 8px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  scrollbar-width: thin;
  scrollbar-color: var(--surface2) transparent;
}
#messages::-webkit-scrollbar { width: 3px; }
#messages::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 2px; }

.msg {
  display: flex;
  gap: 10px;
  animation: fadeUp 0.18s ease;
}
@keyframes fadeUp {
  from { opacity:0; transform:translateY(5px); }
  to   { opacity:1; transform:translateY(0); }
}
.msg-avatar {
  width: 24px; height: 24px;
  border-radius: 4px;
  display: flex; align-items:center; justify-content:center;
  font-size: 10px;
  font-weight: 500;
  flex-shrink: 0;
  margin-top: 2px;
}
.msg.user .msg-avatar {
  background: var(--surface2);
  border: 1px solid var(--border2);
  color: var(--text2);
}
.msg.assistant .msg-avatar {
  background: var(--accent-glow);
  border: 1px solid rgba(112,213,73,0.3);
  color: var(--accent);
}
.msg-body { flex: 1; padding-top: 1px; }
.msg-role {
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text3);
  margin-bottom: 5px;
}
.msg-text {
  font-size: 13px;
  color: var(--text);
  line-height: 1.8;
}
.msg.user .msg-text { color: var(--text2); }
.msg-text strong { color: var(--accent); font-weight: 500; }
.msg-text ul, .msg-text ol { padding-left: 18px; margin: 6px 0; }
.msg-text li { margin: 3px 0; }
.msg-text code {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 1px 5px;
  font-size: 11px;
  color: var(--accent);
}
.msg-text pre {
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  padding: 12px;
  overflow-x: auto;
  margin: 8px 0;
}
.msg-text pre code { background:none; border:none; padding:0; font-size:11px; }

/* TYPING */
.typing-dots { display:flex; gap:4px; align-items:center; padding-top:4px; }
.typing-dots span {
  width:5px; height:5px; border-radius:50%;
  background: var(--accent);
  opacity: 0.4;
  animation: tpulse 1.2s ease-in-out infinite;
}
.typing-dots span:nth-child(2) { animation-delay:0.2s; }
.typing-dots span:nth-child(3) { animation-delay:0.4s; }
@keyframes tpulse {
  0%,80%,100% { opacity:0.2; transform:scale(0.8); }
  40%          { opacity:1;   transform:scale(1); }
}

/* QUICK PILLS */
#quick-questions {
  padding: 0 18px 12px;
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.quick-btn {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 20px;
  color: var(--text2);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  padding: 4px 11px;
  cursor: pointer;
  transition: all 0.12s;
  white-space: nowrap;
}
.quick-btn:hover { border-color:var(--accent); color:var(--accent); background:var(--accent-glow); }

/* INPUT AREA */
#input-area {
  padding: 10px 14px 12px;
  border-top: 1px solid var(--border);
  background: var(--surface);
  display: flex;
  gap: 8px;
  align-items: flex-end;
}
#user-input {
  flex: 1;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  padding: 8px 12px;
  outline: none;
  resize: none;
  min-height: 38px;
  max-height: 110px;
  line-height: 1.5;
  transition: border-color 0.12s;
}
#user-input:focus { border-color: var(--accent2); }
#user-input::placeholder { color: var(--text3); }
#send-btn {
  width: 38px; height: 38px;
  background: var(--accent);
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: flex; align-items:center; justify-content:center;
  transition: background 0.12s, transform 0.1s;
  flex-shrink: 0;
}
#send-btn:hover { background: #85e05e; }
#send-btn:active { transform: scale(0.95); }
#send-btn:disabled { background: var(--surface2); cursor: not-allowed; opacity:0.5; }
#send-btn svg { width:15px; height:15px; }

/* FOOTER */
.footer-bar {
  padding: 6px 16px;
  border-top: 1px solid var(--border);
  background: var(--bg);
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}
.footer-status {
  font-size: 10px;
  color: var(--text3);
  display: flex; align-items:center; gap:5px;
}
.status-dot {
  width:5px; height:5px; border-radius:50%;
  background: var(--accent);
}

/* WELCOME */
.welcome-area {
  text-align: center;
  padding: 40px 20px 24px;
}
.welcome-area h3 {
  font-family: 'Playfair Display', serif;
  font-size: 22px;
  font-weight: 400;
  color: var(--text);
  margin-bottom: 8px;
}
.welcome-area p {
  font-size: 12px;
  color: var(--text2);
  line-height: 1.7;
  max-width: 300px;
  margin: 0 auto;
}
.welcome-divider {
  width: 32px; height: 1px;
  background: var(--border2);
  margin: 16px auto;
}
</style>
</head>

  <span class="header-title">KPI Assistant</span>

</header>

<!-- LOADING -->
<div id="loading-screen">
  <div class="loading-bar-wrap"><div class="loading-bar"></div></div>
  <span class="loading-label">cargando contexto...</span>
</div>

<!-- ERROR -->
<div id="error-screen">
  <div class="error-card">
    <h2>Error de configuración</h2>
    <p id="error-msg">No se pudo inicializar el asistente.</p>
  </div>
</div>

<!-- CHAT -->
<div id="chat-panel">
  <div id="messages">
    <div class="welcome-area" id="welcome">
      <h3>¿En qué puedo ayudarte?</h3>
      <div class="welcome-divider"></div>
      <p>Pregunta sobre KPIs, criterios de cálculo, filtros aplicados o cualquier duda sobre el modelo de datos.</p>
    </div>
  </div>

  <div id="quick-questions">
    <button class="quick-btn" onclick="quickAsk('¿Cómo se calcula el margen bruto?')">margen bruto</button>
    <button class="quick-btn" onclick="quickAsk('¿Qué filtros se aplican sobre esta métrica?')">filtros activos</button>
    <button class="quick-btn" onclick="quickAsk('¿Cuál es la diferencia entre usuarios activos y registrados?')">activos vs registrados</button>
    <button class="quick-btn" onclick="quickAsk('Explícame todos los KPIs disponibles')">listar KPIs</button>
    <button class="quick-btn" onclick="quickAsk('¿Qué tablas forman el modelo de datos y cómo se relacionan?')">modelo de datos</button>
  </div>

  <div id="input-area">
    <textarea id="user-input" placeholder="Escribe tu pregunta..." rows="1"
      onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button id="send-btn" onclick="sendMessage()">
      <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 10H16M16 10L11 5M16 10L11 15" stroke="#0e0f0d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</div>

<div class="footer-bar">
  <span class="footer-status">
    <span class="status-dot"></span>
    <span id="footer-text">iniciando...</span>
  </span>
</div>

<script>
const CONFIG_URL = 'config.json';
let apiKey = '';
let systemCtx = '';
let history = [];
let busy = false;

async function init() {
  try {
    const res = await fetch(CONFIG_URL + '?v=' + Date.now());
    if (!res.ok) throw new Error('No se encontró config.json (HTTP ' + res.status + ')');
    const cfg = await res.json();
    if (!cfg.apiKey) throw new Error('config.json no contiene el campo apiKey');
    apiKey = cfg.apiKey;

    const ctxRes = await fetch('context.txt?v=' + Date.now());
    if (!ctxRes.ok) throw new Error('No se encontró context.txt (HTTP ' + ctxRes.status + ')');
    systemCtx = await ctxRes.text();
    if (!systemCtx.trim()) throw new Error('context.txt está vacío');

    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('chat-panel').style.display = 'flex';
    document.getElementById('footer-text').textContent = 'conectado · claude-haiku-4-5';
    document.getElementById('user-input').focus();
  } catch(e) {
    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('error-screen').style.display = 'flex';
    document.getElementById('error-msg').textContent = e.message;
  }
}

function buildSystem() {
  return `Eres un asistente experto en el modelo de datos y KPIs de Resa.
Responde en español, de forma clara y precisa.
Usa **negrita** para nombres de métricas, tablas o fórmulas clave.
Si algo no está en la documentación, indícalo honestamente.
No inventes datos ni criterios que no estén descritos.

═══════════════════════════════════
DOCUMENTACIÓN DEL MODELO
═══════════════════════════════════
${systemCtx}
═══════════════════════════════════`;
}

async function sendMessage(text) {
  if (busy) return;
  const input = document.getElementById('user-input');
  const userText = text || input.value.trim();
  if (!userText) return;

  input.value = ''; input.style.height = 'auto';
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();
  document.getElementById('quick-questions').style.display = 'none';

  appendMsg('user', userText);
  history.push({ role: 'user', content: userText });

  const tid = appendTyping();
  setLoading(true);

  try {
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 1500,
        system: buildSystem(),
        messages: history
      })
    });
    removeTyping(tid);
    if (!r.ok) {
      const e = await r.json().catch(()=>({}));
      throw new Error(e.error?.message || 'HTTP ' + r.status);
    }
    const d = await r.json();
    const reply = d.content?.[0]?.text || 'Sin respuesta.';
    history.push({ role: 'assistant', content: reply });
    appendMsg('assistant', reply);
  } catch(e) {
    removeTyping(tid);
    appendError(e.message);
  } finally {
    setLoading(false);
  }
}

function quickAsk(t) { sendMessage(t); }

function appendMsg(role, text) {
  const box = document.getElementById('messages');
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  const av = role === 'user' ? 'U' : 'R';
  const rl = role === 'user' ? 'tú' : 'asistente';
  d.innerHTML = `<div class="msg-avatar">${av}</div>
    <div class="msg-body">
      <div class="msg-role">${rl}</div>
      <div class="msg-text">${fmt(text)}</div>
    </div>`;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}

function appendTyping() {
  const box = document.getElementById('messages');
  const id = 't' + Date.now();
  const d = document.createElement('div');
  d.className = 'msg assistant'; d.id = id;
  d.innerHTML = '<div class="msg-avatar">R</div><div class="msg-body"><div class="msg-role">asistente</div><div class="typing-dots"><span></span><span></span><span></span></div></div>';
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
  return id;
}
function removeTyping(id) { const e = document.getElementById(id); if(e) e.remove(); }

function appendError(msg) {
  const box = document.getElementById('messages');
  const d = document.createElement('div');
  d.innerHTML = `<div style="background:rgba(240,100,80,.07);border:1px solid rgba(240,100,80,.2);border-radius:8px;color:#f07a6a;padding:10px 14px;font-size:12px;line-height:1.5;">Error: ${esc(msg)}</div>`;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}

function setLoading(v) {
  busy = v;
  document.getElementById('send-btn').disabled = v;
  document.getElementById('footer-text').textContent = v ? 'consultando...' : 'conectado · claude-haiku-4-5';
}

function fmt(s) {
  return esc(s)
    .replace(/```([\s\S]*?)```/g,'<pre><code>$1</code></pre>')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/^#{1,3} (.+)$/gm,'<strong>$1</strong>')
    .replace(/^- (.+)$/gm,'<li>$1</li>')
    .replace(/(<li>[\s\S]*?<\/li>)/g,'<ul>$1</ul>')
    .replace(/<\/ul>\s*<ul>/g,'')
    .replace(/\n\n/g,'</p><p>')
    .replace(/\n/g,'<br>');
}
function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function handleKey(e) { if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();} }
function autoResize(el) { el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,110)+'px'; }

window.addEventListener('load', init);
</script>
</body>
</html>
