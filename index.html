<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resa · KPI Assistant</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:        #ffffff;
  --surface:   #f5f5f5;
  --surface2:  #ececec;
  --border:    #e0e0e0;
  --border2:   #d0d0d0;
  --accent:    #70d549;
  --accent-dk: #4a9e2e;
  --text:      #1a1a1a;
  --text2:     #555555;
  --text3:     #999999;
  --radius:    8px;
  --radius-sm: 6px;
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
  font-size: 15px;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
header {
  padding: 11px 20px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  display: flex;
  align-items: center;
  gap: 14px;
  flex-shrink: 0;
}
header img { height: 26px; width: auto; display: block; }
.header-sep { width: 1px; height: 18px; background: var(--border2); }
.header-title { font-size: 14px; color: var(--text2); }
.header-model {
  margin-left: auto;
  font-size: 12px;
  color: var(--text3);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 2px 10px;
}
#setup-panel {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  padding: 24px;
}
.setup-card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 32px 36px;
  width: 100%;
  max-width: 440px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
.setup-card h2 { font-size: 20px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
.setup-sub { font-size: 14px; color: var(--text3); margin-bottom: 24px; }
.field-group { margin-bottom: 20px; }
label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 6px;
}
input[type="password"] {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
  font-size: 15px;
  padding: 9px 12px;
  outline: none;
  transition: border-color 0.15s;
}
input[type="password"]:focus { border-color: var(--accent-dk); }
.hint { font-size: 12px; color: var(--text3); margin-top: 5px; line-height: 1.5; }
.btn-primary {
  width: 100%;
  padding: 11px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  font-family: Arial, Helvetica, sans-serif;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s;
}
.btn-primary:hover { background: var(--accent-dk); }
.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
#chat-panel { flex: 1; display: none; flex-direction: column; overflow: hidden; }
#messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px 20px 8px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  scrollbar-width: thin;
  scrollbar-color: var(--border2) transparent;
}
#messages::-webkit-scrollbar { width: 4px; }
#messages::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
.msg { display: flex; gap: 10px; animation: fadeUp 0.15s ease; }
@keyframes fadeUp {
  from { opacity:0; transform:translateY(4px); }
  to   { opacity:1; transform:translateY(0); }
}
.msg-avatar {
  width: 28px; height: 28px;
  border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700;
  flex-shrink: 0; margin-top: 1px;
}
.msg.user .msg-avatar { background: var(--surface2); border: 1px solid var(--border); color: var(--text2); }
.msg.assistant .msg-avatar { background: #e8f8e0; border: 1px solid #b6e8a0; color: var(--accent-dk); }
.msg-body { flex: 1; }
.msg-role { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text3); margin-bottom: 4px; }
.msg-text { font-size: 15px; color: var(--text); line-height: 1.75; }
.msg.user .msg-text { color: var(--text2); }
.msg-text strong { color: var(--text); font-weight: 700; }
.msg-text ul, .msg-text ol { padding-left: 20px; margin: 6px 0; }
.msg-text li { margin: 3px 0; }
.msg-text code { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-size: 13px; color: var(--text2); font-family: monospace; }
.msg-text pre { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px; overflow-x: auto; margin: 8px 0; }
.msg-text pre code { background:none; border:none; padding:0; font-size:13px; }
.typing-dots { display:flex; gap:4px; align-items:center; padding-top:5px; }
.typing-dots span { width:6px; height:6px; border-radius:50%; background: var(--border2); animation: tpulse 1.2s ease-in-out infinite; }
.typing-dots span:nth-child(2) { animation-delay:0.2s; }
.typing-dots span:nth-child(3) { animation-delay:0.4s; }
@keyframes tpulse { 0%,80%,100% { opacity:0.3; transform:scale(0.8); } 40% { opacity:1; transform:scale(1); } }
#quick-questions { padding: 2px 18px 12px; display: flex; gap: 7px; flex-wrap: wrap; }
.quick-btn {
  background: var(--bg); border: 1px solid var(--border2); border-radius: 20px;
  color: var(--text2); font-family: Arial, Helvetica, sans-serif; font-size: 13px;
  padding: 5px 13px; cursor: pointer; transition: all 0.12s; white-space: nowrap;
}
.quick-btn:hover { border-color: var(--accent-dk); color: var(--accent-dk); background: #f0fce8; }
#input-area { padding: 10px 16px 12px; border-top: 1px solid var(--border); background: var(--bg); display: flex; gap: 8px; align-items: flex-end; }
#user-input {
  flex: 1; background: var(--bg); border: 1px solid var(--border2); border-radius: var(--radius-sm);
  color: var(--text); font-family: Arial, Helvetica, sans-serif; font-size: 15px;
  padding: 9px 13px; outline: none; resize: none; min-height: 40px; max-height: 120px;
  line-height: 1.5; transition: border-color 0.15s;
}
#user-input:focus { border-color: var(--accent-dk); }
#user-input::placeholder { color: var(--text3); }
#send-btn {
  width: 40px; height: 40px; background: var(--accent); border: none;
  border-radius: var(--radius-sm); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.12s, transform 0.1s; flex-shrink: 0;
}
#send-btn:hover { background: var(--accent-dk); }
#send-btn:active { transform: scale(0.95); }
#send-btn:disabled { background: var(--surface2); cursor: not-allowed; opacity: 0.6; }
#send-btn svg { width: 16px; height: 16px; }
.footer-bar { padding: 7px 18px; border-top: 1px solid var(--border); background: var(--surface); display: flex; align-items: center; flex-shrink: 0; }
.footer-status { font-size: 12px; color: var(--text3); display: flex; align-items: center; gap: 6px; }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.welcome-area { text-align: center; padding: 44px 20px 20px; }
.welcome-area h3 { font-size: 20px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
.welcome-area p { font-size: 14px; color: var(--text2); line-height: 1.7; max-width: 320px; margin: 0 auto; }
</style>
</head>
<body>

<header>
  <img src="resa_logo.png" alt="Resa">
  <div class="header-sep"></div>
  <span class="header-title">KPI Assistant</span>
  <span class="header-model">claude-haiku-4-5</span>
</header>

<div id="setup-panel">
  <div class="setup-card">
    <h2>Iniciar sesión</h2>
    <p class="setup-sub">Introduce tu API key para conectar con el asistente.</p>
    <div class="field-group">
      <label>API Key de Anthropic</label>
      <input type="password" id="api-key-input" placeholder="sk-ant-api03-..." autocomplete="off">
      <p class="hint">Solo se usa durante esta sesión. No se almacena en ningún servidor.</p>
    </div>
    <button class="btn-primary" id="connect-btn" onclick="initChat()">Conectar &rarr;</button>
  </div>
</div>

<div id="chat-panel">
  <div id="messages">
    <div class="welcome-area" id="welcome">
      <h3>&iquest;En qu&eacute; puedo ayudarte?</h3>
      <p>Pregunta sobre KPIs, criterios de c&aacute;lculo, filtros aplicados o el modelo de datos.</p>
    </div>
  </div>
  <div id="quick-questions">
    <button class="quick-btn" onclick="quickAsk('listar todos los KPIs disponibles')">listar KPIs</button>
    <button class="quick-btn" onclick="quickAsk('tablas del modelo y c\u00f3mo se relacionan')">modelo de datos</button>
  </div>
  <div id="input-area">
    <textarea id="user-input" placeholder="Escribe tu pregunta..." rows="1"
      onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button id="send-btn" onclick="sendMessage()">
      <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 10H16M16 10L11 5M16 10L11 15" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</div>

<div class="footer-bar">
  <span class="footer-status">
    <span class="status-dot"></span>
    <span id="footer-text">listo</span>
  </span>
</div>

<script>
var apiKey = "";
var systemCtx = "";
var chatHistory = [];
var busy = false;

async function initChat() {
  var key = document.getElementById("api-key-input").value.trim();
  if (!key) { alert("Introduce tu API key de Anthropic."); return; }

  var btn = document.getElementById("connect-btn");
  btn.textContent = "Conectando...";
  btn.disabled = true;

  try {
    var r = await fetch("context.txt?v=" + Date.now());
    if (r.ok) {
      var txt = await r.text();
      if (txt.trim()) systemCtx = txt;
    }
  } catch(e) {
    // context.txt no disponible en local, continua sin contexto
  }

  apiKey = key;
  document.getElementById("setup-panel").style.display = "none";
  document.getElementById("chat-panel").style.display = "flex";
  document.getElementById("footer-text").textContent = "conectado \u00b7 claude-haiku-4-5";
  document.getElementById("user-input").focus();
}

function buildSystem() {
  var base = "Eres un asistente experto en el modelo de datos y KPIs de Resa.\n"
    + "Responde en espa\u00f1ol, de forma clara y precisa.\n"
    + "Usa **negrita** para nombres de m\u00e9tricas, tablas o f\u00f3rmulas clave.\n"
    + "Si algo no est\u00e1 en la documentaci\u00f3n, ind\u00edcalo honestamente.\n\n";
  if (systemCtx) {
    base += "DOCUMENTACI\u00d3N DEL MODELO\n"
      + "==================\n"
      + systemCtx
      + "\n==================";
  }
  return base;
}

async function sendMessage(text) {
  if (busy) return;
  var input = document.getElementById("user-input");
  var userText = text || input.value.trim();
  if (!userText) return;

  input.value = "";
  input.style.height = "auto";
  var welcome = document.getElementById("welcome");
  if (welcome) welcome.remove();
  document.getElementById("quick-questions").style.display = "none";

  appendMsg("user", userText);
  chatHistory.push({ role: "user", content: userText });

  var tid = appendTyping();
  setStatus("enviando petici\u00f3n...");
  busy = true;
  document.getElementById("send-btn").disabled = true;

  try {
    setStatus("conectando con API...");
    var r = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: "claude-haiku-4-5-20251001",
        max_tokens: 1500,
        system: buildSystem(),
        messages: chatHistory
      })
    });
    removeTyping(tid);
    setStatus("respuesta recibida HTTP " + r.status);
    if (!r.ok) {
      var errData = await r.json().catch(function() { return {}; });
      throw new Error((errData.error && errData.error.message) || "HTTP " + r.status);
    }
    var d = await r.json();
    var reply = (d.content && d.content[0] && d.content[0].text) || "Sin respuesta.";
    chatHistory.push({ role: "assistant", content: reply });
    appendMsg("assistant", reply);
    setStatus("conectado \u00b7 claude-haiku-4-5");
  } catch(e) {
    removeTyping(tid);
    appendError(e.message);
    setStatus("error: " + e.message);
  } finally {
    busy = false;
    document.getElementById("send-btn").disabled = false;
  }
}

function quickAsk(t) { sendMessage(t); }

function appendMsg(role, text) {
  var box = document.getElementById("messages");
  var d = document.createElement("div");
  d.className = "msg " + role;
  var av = role === "user" ? "U" : "R";
  var rl = role === "user" ? "T\u00fa" : "Asistente";
  d.innerHTML = '<div class="msg-avatar">' + av + '</div>'
    + '<div class="msg-body">'
    + '<div class="msg-role">' + rl + '</div>'
    + '<div class="msg-text">' + fmt(text) + '</div>'
    + '</div>';
  box.appendChild(d);
  if (role === "user") {
    box.scrollTop = box.scrollHeight;
  } else {
    box.scrollTop = d.offsetTop + 20;
  }
}

function appendTyping() {
  var box = document.getElementById("messages");
  var id = "t" + Date.now();
  var d = document.createElement("div");
  d.className = "msg assistant";
  d.id = id;
  d.innerHTML = '<div class="msg-avatar">R</div>'
    + '<div class="msg-body">'
    + '<div class="msg-role">Asistente</div>'
    + '<div class="typing-dots"><span></span><span></span><span></span></div>'
    + '</div>';
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
  return id;
}

function removeTyping(id) {
  var e = document.getElementById(id);
  if (e) e.remove();
}

function appendError(msg) {
  var box = document.getElementById("messages");
  var d = document.createElement("div");
  d.innerHTML = '<div style="background:#fff5f5;border:1px solid #f5c6c6;border-radius:6px;color:#c0392b;padding:10px 14px;font-size:14px;line-height:1.5;">Error: ' + esc(msg) + '</div>';
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}

function setStatus(msg) {
  document.getElementById("footer-text").textContent = msg;
}

function fmt(s) {
  return esc(s)
    .replace(/```([\s\S]*?)```/g, "<pre><code>$1</code></pre>")
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/^#{1,3} (.+)$/gm, "<strong>$1</strong>")
    .replace(/^- (.+)$/gm, "<li>$1</li>")
    .replace(/(<li>[\s\S]*?<\/li>)/g, "<ul>$1</ul>")
    .replace(/<\/ul>\s*<ul>/g, "")
    .replace(/\n\n/g, "</p><p>")
    .replace(/\n/g, "<br>");
}

function esc(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function handleKey(e) {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function autoResize(el) {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 120) + "px";
}

document.getElementById("api-key-input").addEventListener("keydown", function(e) {
  if (e.key === "Enter") initChat();
});
</script>
</body>
</html>
